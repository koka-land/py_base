<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>МЭШ Ассистент</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --primary-soft: #e8f0fe;
            --danger: #d93025;
            --danger-soft: #fce8e6;
            --text: #202124;
            --text-muted: #5f6368;
            --border: #dadce0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-soft);
            padding: 3px 8px;
            border-radius: 999px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .mode-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        .mode-card {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .mode-card:has(input:checked) {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .mode-card input {
            margin-top: 3px;
            accent-color: var(--primary);
        }

        .mode-title {
            font-size: 13px;
            font-weight: 600;
            display: block;
        }

        .mode-desc {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-top: 2px;
        }

        .options {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-row input {
            width: 15px;
            height: 15px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
        }

        button:active { transform: scale(0.98); }

        #startBtn {
            background: var(--primary);
            color: #fff;
        }

        #startBtn:hover { background: var(--primary-hover); }

        #stopBtn {
            background: var(--danger-soft);
            color: var(--danger);
            flex: 0 0 auto;
            padding: 10px 14px;
        }

        #stopBtn:hover { background: #fad2cf; }
    </style>
</head>
<body>
    <div class="header">
        <span class="title">МЭШ Ассистент</span>
        <span class="badge">v2.0</span>
    </div>

    <div class="section-label">Режим работы</div>
    <div class="mode-group">
        <label class="mode-card">
            <input type="radio" name="mode" value="background" checked>
            <span>
                <span class="mode-title">В фоновом режиме</span>
                <span class="mode-desc">Быстро через API (~5–10 сек на класс)</span>
            </span>
        </label>
        <label class="mode-card">
            <input type="radio" name="mode" value="realtime">
            <span>
                <span class="mode-title">В реальном времени</span>
                <span class="mode-desc">Наглядно с открытием карточек</span>
            </span>
        </label>
    </div>

    <div class="options">
        <label class="checkbox-row">
            <input type="checkbox" id="forceRecalc">
            <span>Переоценивать уже выставленные</span>
        </label>
        <label class="checkbox-row">
            <input type="checkbox" id="processAll">
            <span>Пройти все классы по списку</span>
        </label>
    </div>

    <div class="actions">
        <button id="startBtn">Запустить</button>
        <button id="stopBtn">Стоп</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
